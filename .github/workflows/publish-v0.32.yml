name: Publish launcher v0.32 single EXE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.32.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-launcher-v0.32
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kasyanovea17-crypto/F1-25-Russian' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and test v0.32 without an installed game
        run: python scripts/release_ci_032.py
      - name: Prepare verified single-EXE assets
        run: python scripts/publish_v032.py
      - name: Publish v0.32 and verify the public download
        run: python scripts/publish_v032.py --publish
        env:
          GH_TOKEN: ${{ github.token }}
