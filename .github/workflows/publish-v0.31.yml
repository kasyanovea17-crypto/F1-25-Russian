name: Publish launcher v0.31 single EXE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.31.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-launcher-v0.31
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kasyanovea17-crypto/F1-25-Russian' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and test single EXE, commands, profiles and rollback
        run: python scripts/release_ci_031.py
      - name: Prepare verified EXE assets
        run: python scripts/publish_v031.py
      - name: Publish verified v0.31
        run: python scripts/publish_v031.py --publish
        env:
          GH_TOKEN: ${{ github.token }}
